<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" fill="#0b1324"/>
  <!-- Top Bar -->
  <rect x="0" y="0" width="960" height="50" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="30" cy="25" r="8" fill="#38bdf8"/>
  <text x="50" y="31" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">TDMForge Pro</text>
  <text x="165" y="31" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">v1.0.0</text>
  <text x="220" y="31" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">CCSDS 503.0-B-2 Tracking Data &amp; Ground Navigation Studio</text>
  <rect x="840" y="12" width="95" height="26" rx="4" fill="#059669"/>
  <text x="887" y="29" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">10/10 PASS</text>

  <!-- Left Column: Polar Skyplot & Observables -->
  <rect x="20" y="70" width="440" height="445" rx="8" fill="#131f37" stroke="#1e293b" stroke-width="1"/>
  <text x="35" y="98" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">GROUND ANTENNA POLAR SKYPLOT (AZ / EL)</text>

  <!-- Polar Canvas Box -->
  <rect x="35" y="112" width="410" height="230" rx="6" fill="#040812" stroke="#1e293b"/>
  <!-- Concentric Rings (0, 30, 60 deg elevation) -->
  <circle cx="240" cy="227" r="95" fill="none" stroke="#334155" stroke-width="1"/>
  <circle cx="240" cy="227" r="63" fill="none" stroke="#1e293b" stroke-width="1"/>
  <circle cx="240" cy="227" r="31" fill="none" stroke="#1e293b" stroke-width="1"/>

  <line x1="240" y1="132" x2="240" y2="322" stroke="#1e293b"/>
  <line x1="145" y1="227" x2="335" y2="227" stroke="#1e293b"/>

  <text x="235" y="127" fill="#64748b" font-size="9" font-family="sans-serif">N 0°</text>
  <text x="340" y="230" fill="#64748b" font-size="9" font-family="sans-serif">E 90°</text>
  <text x="235" y="334" fill="#64748b" font-size="9" font-family="sans-serif">S 180°</text>
  <text x="120" y="230" fill="#64748b" font-size="9" font-family="sans-serif">W 270°</text>

  <!-- Pointing Boresight Target -->
  <line x1="240" y1="227" x2="285" y2="175" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="285" cy="175" r="5" fill="#38bdf8"/>
  <circle cx="285" cy="175" r="9" fill="none" stroke="#38bdf8" stroke-width="1"/>
  <text x="298" y="172" fill="#fff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">EUROPA-CLIPPER (AZ: 142.5°, EL: 48.2°)</text>

  <!-- Observables Grid -->
  <rect x="35" y="355" width="195" height="42" rx="4" fill="#0f172a"/>
  <text x="45" y="370" fill="#94a3b8" font-size="9" font-family="sans-serif">ONE-WAY RANGE</text>
  <text x="45" y="388" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="bold">185.85 M km (1.24 AU)</text>

  <rect x="250" y="355" width="195" height="42" rx="4" fill="#0f172a"/>
  <text x="260" y="370" fill="#94a3b8" font-size="9" font-family="sans-serif">TWO-WAY LIGHT TIME (RTLT)</text>
  <text x="260" y="388" fill="#f59e0b" font-size="12" font-family="monospace" font-weight="bold">1,240.2 s (20.67 min)</text>

  <rect x="35" y="405" width="195" height="42" rx="4" fill="#0f172a"/>
  <text x="45" y="420" fill="#94a3b8" font-size="9" font-family="sans-serif">CARRIER DOPPLER SHIFT</text>
  <text x="45" y="438" fill="#f43f5e" font-size="12" font-family="monospace" font-weight="bold">-595.04 kHz (+12.45 km/s)</text>

  <rect x="250" y="405" width="195" height="42" rx="4" fill="#0f172a"/>
  <text x="260" y="420" fill="#94a3b8" font-size="9" font-family="sans-serif">ATMOSPHERIC MEDIA DELAYS</text>
  <text x="260" y="438" fill="#10b981" font-size="12" font-family="monospace" font-weight="bold">Tropo: 2.84m | Iono: 0.14m</text>

  <!-- Right Column: TDM KVN Output -->
  <rect x="480" y="70" width="460" height="445" rx="8" fill="#131f37" stroke="#1e293b" stroke-width="1"/>
  <text x="500" y="98" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">CCSDS 503.0-B-2 TRACKING DATA MESSAGE (KVN)</text>

  <rect x="500" y="112" width="420" height="385" rx="6" fill="#050914" stroke="#1e293b"/>
  <text x="515" y="136" fill="#64748b" font-family="monospace" font-size="11">CCSDS_TDM_VERS = 2.0</text>
  <text x="515" y="152" fill="#64748b" font-family="monospace" font-size="11">CREATION_DATE  = 2026-10-17T06:00:00.000Z</text>
  <text x="515" y="168" fill="#64748b" font-family="monospace" font-size="11">ORIGINATOR     = TDMFORGE_PRO_NAV</text>
  <text x="515" y="188" fill="#a5b4fc" font-family="monospace" font-size="11">META_START</text>
  <text x="515" y="204" fill="#cbd5e1" font-family="monospace" font-size="11">PARTICIPANT_1  = DSS-14</text>
  <text x="515" y="220" fill="#cbd5e1" font-family="monospace" font-size="11">PARTICIPANT_2  = EUROPA-CLIPPER</text>
  <text x="515" y="236" fill="#cbd5e1" font-family="monospace" font-size="11">MODE           = SEQUENTIAL</text>
  <text x="515" y="252" fill="#cbd5e1" font-family="monospace" font-size="11">PATH           = 1,2,1 (Two-Way Coherent)</text>
  <text x="515" y="268" fill="#cbd5e1" font-family="monospace" font-size="11">RANGE_UNITS    = RU</text>
  <text x="515" y="284" fill="#a5b4fc" font-family="monospace" font-size="11">META_STOP</text>
  <text x="515" y="304" fill="#a5b4fc" font-family="monospace" font-size="11">DATA_START</text>
  <text x="515" y="320" fill="#38bdf8" font-family="monospace" font-size="11">TRANSMIT_FREQ_1       = 7165000000.0 [Hz]</text>
  <text x="515" y="336" fill="#f43f5e" font-family="monospace" font-size="11">DOPPLER_INSTANTANEOUS = -595040.000 [Hz]</text>
  <text x="515" y="352" fill="#34d399" font-family="monospace" font-size="11">RANGE                 = 8883652875143.0 [RU]</text>
  <text x="515" y="368" fill="#f59e0b" font-family="monospace" font-size="11">ANGLE_1               = 142.5000 [deg]</text>
  <text x="515" y="384" fill="#f59e0b" font-family="monospace" font-size="11">ANGLE_2               = 48.2000 [deg]</text>
  <text x="515" y="400" fill="#10b981" font-family="monospace" font-size="11">[10/10 PASS] NORMATIVE SCORECARD CERTIFIED</text>
</svg>
